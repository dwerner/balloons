[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
repository = "https://github.com/dwerner/balloons"

[workspace.dependencies]
# Async runtime
core-executor = { git = "https://github.com/dwerner/core-executor" }

# Storage
redb = "2"
postcard = { version = "1", features = ["alloc"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
async-trait = "0.1"
futures-lite = "2"

# Error handling
thiserror = "2"

# Testing
tempfile = "3"

# Python bindings
pyo3 = { version = "0.25", features = ["extension-module"] }

# Internal crates
balloons-core = { path = "crates/balloons-core" }
