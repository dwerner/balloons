[package]
name = "balloons-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser automation for Balloons using surfer-rs with smol runtime"

[dependencies]
# Browser automation - using local smol-based fantoccini fork
surfer-rs = { path = "../../../../forks/surfer-rs", features = ["smol-runtime"], default-features = false }

# Async runtime (smol for core-executor compatibility)
smol = "2"
async-process = "2"
futures-lite.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Unique IDs
uuid.workspace = true

# Logging
tracing.workspace = true
