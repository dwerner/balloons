<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloons Web UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      overflow: hidden;
    }

    #root {
      height: 100%;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      height: 100%;
    }

    /* Mobile header (visible on mobile only) */
    .mobile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }

    .menu-button {
      background: none;
      border: none;
      color: #eee;
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .mobile-header h1 {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100%;
      background: #16213e;
      border-right: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 100;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .close-button {
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .close-button:hover {
      color: #eee;
    }

    /* Desktop layout */
    @media (min-width: 768px) {
      .app {
        grid-template-columns: 280px 1fr;
        grid-template-rows: 1fr;
      }

      .mobile-header {
        display: none;
      }

      .sidebar {
        position: static;
        transform: none;
        z-index: auto;
      }

      .sidebar-overlay {
        display: none;
      }

      .close-button {
        display: none;
      }
    }

    .connection-status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e94560;
    }

    .connection-status.connected {
      background: #4ade80;
    }

    .connection-status.connecting {
      background: #facc15;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .session-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.2s;
    }

    .session-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .session-item.selected {
      background: #0f3460;
    }

    .session-item.streaming {
      border-left: 3px solid #4ade80;
    }

    .session-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-meta {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .main-panel {
      display: flex;
      flex-direction: column;
      background: #1a1a2e;
      overflow: hidden; /* Constrain children so flex+overflow works */
      min-height: 0; /* Allow flex item to shrink below content size */
    }

    .turns-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      padding-bottom: 24px; /* Extra space so last message isn't cut off */
      min-height: 0; /* Allow flex item to shrink below content size for overflow to work */
    }

    .turn {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      max-width: 95%;
    }

    .turn:last-of-type {
      margin-bottom: 0; /* No margin on last turn, padding handles spacing */
    }

    @media (min-width: 768px) {
      .turns-container {
        padding: 16px;
        padding-bottom: 32px;
      }

      .turn {
        margin-bottom: 16px;
        padding: 12px 16px;
        max-width: 80%;
      }
    }

    .turn.user {
      background: #0f3460;
      margin-left: auto;
    }

    .turn.assistant {
      background: #16213e;
      border: 1px solid #0f3460;
    }

    .turn-role {
      font-size: 11px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .turn-content {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    .turn.streaming .turn-content::after {
      content: '|';
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .input-area {
      border-top: 1px solid #0f3460;
      padding: 12px;
      background: #16213e;
    }

    .input-form {
      display: flex;
      gap: 8px;
    }

    .input-field {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #0f3460;
      border-radius: 8px;
      background: #1a1a2e;
      color: #eee;
      font-size: 16px; /* Prevents iOS zoom on focus */
      resize: none;
      min-height: 44px;
      max-height: 120px;
    }

    .input-field:focus {
      outline: none;
      border-color: #4ade80;
    }

    .send-button {
      padding: 10px 16px;
      background: #4ade80;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    @media (min-width: 768px) {
      .input-area {
        padding: 16px;
      }

      .input-field {
        padding: 12px 16px;
        font-size: 14px;
        min-height: 48px;
        max-height: 200px;
      }

      .send-button {
        padding: 12px 24px;
      }
    }

    .send-button:hover:not(:disabled) {
      background: #22c55e;
    }

    .send-button:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
    }

    .stop-button {
      padding: 10px 16px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .stop-button:hover:not(:disabled) {
      background: #dc2626;
    }

    .stop-button:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
    }

    @media (min-width: 768px) {
      .stop-button {
        padding: 12px 24px;
      }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
    }

    .empty-state h2 {
      margin-bottom: 8px;
    }

    .error-message {
      background: #7f1d1d;
      color: #fca5a5;
      padding: 12px 16px;
      margin: 8px;
      border-radius: 8px;
    }

    /* Queue mode indicator */
    .input-area.queue-mode {
      border-top: 2px solid #facc15;
      background: linear-gradient(to bottom, rgba(250, 204, 21, 0.1) 0%, #16213e 50%);
    }

    .queue-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #facc15;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .queue-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #facc15;
      animation: pulse 1s infinite;
    }

    .queue-button {
      padding: 10px 16px;
      background: #facc15;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .queue-button:hover:not(:disabled) {
      background: #eab308;
    }

    .queue-button:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
    }

    @media (min-width: 768px) {
      .queue-button {
        padding: 12px 24px;
      }
    }

    .input-area.queue-mode .input-field:focus {
      border-color: #facc15;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
