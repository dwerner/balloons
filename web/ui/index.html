<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloons Web UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      overflow: hidden;
    }

    #root {
      height: 100%;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      height: 100%;
    }

    /* Mobile header (visible on mobile only) */
    .mobile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }

    .menu-button {
      background: none;
      border: none;
      color: #eee;
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .mobile-header h1 {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100%;
      background: #16213e;
      border-right: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 100;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .close-button {
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .close-button:hover {
      color: #eee;
    }

    /* Desktop layout */
    @media (min-width: 768px) {
      .app {
        grid-template-columns: 280px 1fr;
        grid-template-rows: 1fr;
      }

      .mobile-header {
        display: none;
      }

      .sidebar {
        position: static;
        transform: none;
        z-index: auto;
      }

      .sidebar-overlay {
        display: none;
      }

      .close-button {
        display: none;
      }
    }

    .connection-status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e94560;
    }

    .connection-status.connected {
      background: #4ade80;
    }

    .connection-status.connecting {
      background: #facc15;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .session-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.2s;
    }

    .session-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .session-item.selected {
      background: #0f3460;
    }

    .session-item.streaming {
      border-left: 3px solid #4ade80;
    }

    .session-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-meta {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .session-streaming-info {
      margin-top: 6px;
    }

    .streaming-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }

    .streaming-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 1s infinite;
    }

    .main-panel {
      display: flex;
      flex-direction: column;
      background: #1a1a2e;
      overflow: hidden; /* Constrain children so flex+overflow works */
      min-height: 0; /* Allow flex item to shrink below content size */
    }

    .turns-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      padding-bottom: 24px; /* Extra space so last message isn't cut off */
      min-height: 0; /* Allow flex item to shrink below content size for overflow to work */
    }

    .turn {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      max-width: 95%;
    }

    .turn:last-of-type {
      margin-bottom: 0; /* No margin on last turn, padding handles spacing */
    }

    @media (min-width: 768px) {
      .turns-container {
        padding: 16px;
        padding-bottom: 32px;
      }

      .turn {
        margin-bottom: 16px;
        padding: 12px 16px;
        max-width: 80%;
      }
    }

    .turn.user {
      background: #0f3460;
      margin-left: auto;
    }

    .turn.assistant {
      background: #16213e;
      border: 1px solid #0f3460;
    }

    .turn.tool {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-left: 3px solid #facc15;
      font-size: 0.9em;
      max-width: 100%;
    }

    .turn.tool .turn-role {
      color: #facc15;
    }

    .turn.tool .turn-content {
      color: #d1d5db;
    }

    .turn.system {
      background: #1e1e32;
      border: 1px dashed #4b5563;
      font-size: 0.85em;
      max-width: 100%;
      color: #9ca3af;
    }

    .turn.system .turn-role {
      color: #6b7280;
    }

    .turn.system .turn-content {
      color: #9ca3af;
      font-style: italic;
    }

    /* Empty content placeholder */
    .turn-content .empty-content {
      display: inline-block;
      min-height: 1.5em;
      color: #6b7280;
    }

    .turn-role {
      font-size: 11px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .turn-content {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      min-height: 1.5em;
    }

    .turn.streaming .turn-content::after {
      content: '|';
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .input-area {
      border-top: 1px solid #0f3460;
      padding: 12px;
      background: #16213e;
    }

    .input-form {
      display: flex;
      gap: 8px;
    }

    .input-field {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #0f3460;
      border-radius: 8px;
      background: #1a1a2e;
      color: #eee;
      font-size: 16px; /* Prevents iOS zoom on focus */
      resize: none;
      min-height: 44px;
      max-height: 120px;
    }

    .input-field:focus {
      outline: none;
      border-color: #4ade80;
    }

    .send-button {
      padding: 10px 16px;
      background: #4ade80;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    @media (min-width: 768px) {
      .input-area {
        padding: 16px;
      }

      .input-field {
        padding: 12px 16px;
        font-size: 14px;
        min-height: 48px;
        max-height: 200px;
      }

      .send-button {
        padding: 12px 24px;
      }
    }

    .send-button:hover:not(:disabled) {
      background: #22c55e;
    }

    .send-button:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
    }

    .stop-button {
      padding: 10px 16px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .stop-button:hover:not(:disabled) {
      background: #dc2626;
    }

    .stop-button:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
    }

    @media (min-width: 768px) {
      .stop-button {
        padding: 12px 24px;
      }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
    }

    .empty-state h2 {
      margin-bottom: 8px;
    }

    .error-message {
      background: #7f1d1d;
      color: #fca5a5;
      padding: 12px 16px;
      margin: 8px;
      border-radius: 8px;
    }

    /* Queue mode indicator */
    .input-area.queue-mode {
      border-top: 2px solid #facc15;
      background: linear-gradient(to bottom, rgba(250, 204, 21, 0.1) 0%, #16213e 50%);
    }

    .queue-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #facc15;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .queue-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #facc15;
      animation: pulse 1s infinite;
    }

    .queue-button {
      padding: 10px 16px;
      background: #facc15;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .queue-button:hover:not(:disabled) {
      background: #eab308;
    }

    .queue-button:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
    }

    @media (min-width: 768px) {
      .queue-button {
        padding: 12px 24px;
      }
    }

    .input-area.queue-mode .input-field:focus {
      border-color: #facc15;
    }

    /* Streaming status bar */
    .streaming-status {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: rgba(74, 222, 128, 0.08);
      border: 1px solid rgba(74, 222, 128, 0.2);
      border-radius: 8px;
      font-size: 13px;
    }

    .streaming-status-main {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .streaming-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 1s infinite;
      flex-shrink: 0;
    }

    .streaming-model {
      font-weight: 600;
      color: #4ade80;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .streaming-duration {
      color: #888;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .streaming-status-details {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 16px;
      font-size: 12px;
      color: #888;
    }

    .streaming-tokens {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .token-rate {
      color: #666;
    }

    .streaming-tool {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #facc15;
      font-weight: 500;
    }

    .tool-icon {
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .queue-badge {
      background: rgba(250, 204, 21, 0.2);
      color: #facc15;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }

    @media (min-width: 768px) {
      .streaming-status {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
      }

      .streaming-status-details {
        padding-left: 0;
      }
    }

    /* Markdown styles for assistant, tool, and system messages */
    .turn.assistant .turn-content,
    .turn.tool .turn-content,
    .turn.system .turn-content {
      white-space: normal;
    }

    .turn.assistant .turn-content p,
    .turn.tool .turn-content p,
    .turn.system .turn-content p {
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .turn.assistant .turn-content p:last-child,
    .turn.tool .turn-content p:last-child,
    .turn.system .turn-content p:last-child {
      margin-bottom: 0;
    }

    .turn.assistant .turn-content h1,
    .turn.assistant .turn-content h2,
    .turn.assistant .turn-content h3,
    .turn.assistant .turn-content h4,
    .turn.assistant .turn-content h5,
    .turn.assistant .turn-content h6,
    .turn.tool .turn-content h1,
    .turn.tool .turn-content h2,
    .turn.tool .turn-content h3,
    .turn.tool .turn-content h4,
    .turn.tool .turn-content h5,
    .turn.tool .turn-content h6 {
      margin-top: 20px;
      margin-bottom: 12px;
      font-weight: 600;
      line-height: 1.3;
    }

    .turn.assistant .turn-content h1:first-child,
    .turn.assistant .turn-content h2:first-child,
    .turn.assistant .turn-content h3:first-child,
    .turn.tool .turn-content h1:first-child,
    .turn.tool .turn-content h2:first-child,
    .turn.tool .turn-content h3:first-child {
      margin-top: 0;
    }

    .turn.assistant .turn-content h1,
    .turn.tool .turn-content h1 { font-size: 1.5em; }
    .turn.assistant .turn-content h2,
    .turn.tool .turn-content h2 { font-size: 1.3em; }
    .turn.assistant .turn-content h3,
    .turn.tool .turn-content h3 { font-size: 1.15em; }
    .turn.assistant .turn-content h4,
    .turn.tool .turn-content h4 { font-size: 1em; }

    .turn.assistant .turn-content ul,
    .turn.assistant .turn-content ol,
    .turn.tool .turn-content ul,
    .turn.tool .turn-content ol {
      margin-bottom: 12px;
      padding-left: 24px;
    }

    .turn.assistant .turn-content li,
    .turn.tool .turn-content li {
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .turn.assistant .turn-content li:last-child,
    .turn.tool .turn-content li:last-child {
      margin-bottom: 0;
    }

    .turn.assistant .turn-content li > ul,
    .turn.assistant .turn-content li > ol,
    .turn.tool .turn-content li > ul,
    .turn.tool .turn-content li > ol {
      margin-top: 6px;
      margin-bottom: 0;
    }

    /* Inline code */
    .turn.assistant .turn-content .inline-code,
    .turn.tool .turn-content .inline-code {
      background: #0d1117;
      color: #e6db74;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 0.9em;
    }

    /* Code block wrapper */
    .turn.assistant .turn-content .code-block-wrapper,
    .turn.tool .turn-content .code-block-wrapper {
      margin: 12px 0;
      border-radius: 8px;
      overflow: hidden;
      background: #0d1117;
      border: 1px solid #30363d;
    }

    .turn.assistant .turn-content .code-block-wrapper:first-child,
    .turn.tool .turn-content .code-block-wrapper:first-child {
      margin-top: 0;
    }

    .turn.assistant .turn-content .code-block-wrapper:last-child,
    .turn.tool .turn-content .code-block-wrapper:last-child {
      margin-bottom: 0;
    }

    .turn.assistant .turn-content .code-language,
    .turn.tool .turn-content .code-language {
      background: #161b22;
      color: #8b949e;
      font-size: 12px;
      padding: 6px 12px;
      border-bottom: 1px solid #30363d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Override any default pre/code styles in code blocks */
    .turn.assistant .turn-content pre,
    .turn.tool .turn-content pre {
      margin: 0;
      overflow-x: auto;
    }

    .turn.assistant .turn-content pre code,
    .turn.tool .turn-content pre code {
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
    }

    /* Blockquotes */
    .turn.assistant .turn-content blockquote,
    .turn.tool .turn-content blockquote {
      border-left: 3px solid #4ade80;
      margin: 12px 0;
      padding: 8px 16px;
      background: rgba(74, 222, 128, 0.1);
      color: #c9d1d9;
    }

    .turn.assistant .turn-content blockquote p:last-child,
    .turn.tool .turn-content blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Tables */
    .turn.assistant .turn-content table,
    .turn.tool .turn-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.9em;
    }

    .turn.assistant .turn-content th,
    .turn.assistant .turn-content td,
    .turn.tool .turn-content th,
    .turn.tool .turn-content td {
      border: 1px solid #30363d;
      padding: 8px 12px;
      text-align: left;
    }

    .turn.assistant .turn-content th,
    .turn.tool .turn-content th {
      background: #161b22;
      font-weight: 600;
    }

    .turn.assistant .turn-content tr:nth-child(even),
    .turn.tool .turn-content tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Horizontal rule */
    .turn.assistant .turn-content hr,
    .turn.tool .turn-content hr {
      border: none;
      border-top: 1px solid #30363d;
      margin: 20px 0;
    }

    /* Links */
    .turn.assistant .turn-content a,
    .turn.tool .turn-content a {
      color: #58a6ff;
      text-decoration: none;
    }

    .turn.assistant .turn-content a:hover,
    .turn.tool .turn-content a:hover {
      text-decoration: underline;
    }

    /* Strong and emphasis */
    .turn.assistant .turn-content strong,
    .turn.tool .turn-content strong {
      font-weight: 600;
      color: #fff;
    }

    .turn.assistant .turn-content em,
    .turn.tool .turn-content em {
      font-style: italic;
    }

    /* Task lists (GFM) */
    .turn.assistant .turn-content input[type="checkbox"],
    .turn.tool .turn-content input[type="checkbox"] {
      margin-right: 8px;
      accent-color: #4ade80;
    }

    /* Strikethrough (GFM) */
    .turn.assistant .turn-content del,
    .turn.tool .turn-content del {
      color: #8b949e;
    }

    /* Tool use visualization styles */
    .turn-tool-uses {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tool-use {
      background: #1e2433;
      border: 1px solid #2d3748;
      border-radius: 8px;
      overflow: hidden;
      font-size: 0.9em;
    }

    .tool-use.streaming {
      border-color: #facc15;
    }

    .tool-use.executing {
      border-color: #60a5fa;
    }

    .tool-use.completed {
      border-color: #4ade80;
    }

    .tool-use.error {
      border-color: #f87171;
    }

    .tool-use-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid #2d3748;
    }

    .tool-use-status {
      font-size: 14px;
      line-height: 1;
    }

    .tool-use-status.streaming {
      color: #facc15;
    }

    .tool-use-status.executing {
      color: #60a5fa;
    }

    .tool-use-status.completed {
      color: #4ade80;
    }

    .tool-use-status.error {
      color: #f87171;
    }

    .tool-spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    .tool-use-name {
      font-weight: 600;
      color: #e2e8f0;
      flex: 1;
    }

    .tool-use-duration {
      color: #64748b;
      font-size: 0.85em;
      font-variant-numeric: tabular-nums;
    }

    /* Collapsible component */
    .collapsible {
      border-top: 1px solid #2d3748;
    }

    .collapsible-header {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 6px 12px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }

    .collapsible-header:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .collapsible-icon {
      font-size: 8px;
      color: #64748b;
    }

    .collapsible-title {
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .collapsible-content {
      padding: 0;
    }

    /* Tool input/output JSON */
    .tool-use-json,
    .tool-use-result {
      margin: 0;
      padding: 8px 12px;
      background: #0d1117;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #c9d1d9;
      overflow-x: auto;
      max-height: 300px;
      overflow-y: auto;
    }

    .tool-use-json code,
    .tool-use-result code {
      white-space: pre-wrap;
      word-break: break-all;
    }

    .tool-use-result.error {
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
    }

    /* Image attachment styles */
    .image-preview-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .image-preview {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #30363d;
      transition: border-color 0.2s;
    }

    .image-preview:hover {
      border-color: #4ade80;
    }

    .image-preview.error {
      border-color: #f87171;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-remove-button {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .image-preview:hover .image-remove-button {
      opacity: 1;
    }

    .image-remove-button:hover {
      background: #e94560;
    }

    .image-error {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(248, 113, 113, 0.9);
      color: #fff;
      font-size: 10px;
      padding: 2px 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .attach-button {
      padding: 10px 12px;
      background: transparent;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .attach-button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.05);
      border-color: #4ade80;
    }

    .attach-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (min-width: 768px) {
      .image-preview {
        width: 100px;
        height: 100px;
      }

      .attach-button {
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
