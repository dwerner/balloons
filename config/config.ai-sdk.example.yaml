# AI SDK Backend Configuration
# -----------------------------
# This configures balloons to use the Rust ai-sdk-openai-compatible crate
# for high-performance OpenAI-compatible API access.

# Prerequisites:
# 1. Build the Python bindings:
#    cd balloons-rs/crates/ai-sdk-openai-compatible-py
#    maturin develop
#
# 2. Run an OpenAI-compatible server (llama.cpp, vLLM, etc.):
#    llama-server --port 8000 --model /path/to/model.gguf

default_backend: ai_sdk

backends:
  ai_sdk:
    type: ai_sdk
    base_url: http://192.168.0.196:8000  # Your OpenAI-compatible server
    model: Qwen3.5-122B-A10B-Q6_K-00001-of-00004.gguf  # Model loaded on server
    api_key: not-needed  # Optional, for servers requiring auth
    context_window: 200000
    system_prompt: ~/.balloons/prompts/coding-assistant.md
