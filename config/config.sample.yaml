# Balloons Configuration
# ----------------------
# This file configures the LLM backend for balloons.
# Copy to ~/.balloons/config.yaml or set BALLOONS_CONFIG env var.

# Default backend to use (must match a key in 'backends' below)
default_backend: claude

# Performance timing mode (optional)
# When true, filters debug log to show only PERF-level entries (timing data).
# This reduces noise and shows:
#   - LLM API call duration (first token, stream complete)
#   - Storage operation latency (save_session, load_session)
#   - Turn rendering time (load_history)
# debug_perf_mode: false

# Editor for :edit-config and :edit-prompt commands
# Falls back to $VISUAL, then $EDITOR, then vi
# editor: nvim

# Session safety kill switch
# Stop an agent stream when cumulative session token usage reaches this limit.
# Uses session total_input_tokens + total_output_tokens.
# Set to 0 to disable.
# session_token_kill_switch: 200000

# Sound notifications (files in ~/.balloons/sounds/)
# Uses sounds from https://github.com/akx/Notifications (CC0/CC-BY-3.0)
# sounds:
#   enabled: true
#   done: Chord.ogg        # Played when streaming completes
#   error: Glitch.ogg      # Played on errors
#   notification: Polite.ogg  # Played when input is required

# Reports configuration
# reports:
#   # Directory where generated reports are saved
#   # Supports ~ for home directory expansion
#   # Defaults to:
#   #   Linux: ~/.local/share/balloons/reports/ (or $XDG_DATA_HOME/balloons/reports/)
#   #   macOS: ~/Library/Application Support/balloons/reports/
#   #   Other: ~/Documents/balloons/reports/
#   output_path: ~/Documents/balloons/reports/

# Available backends
backends:
  # Direct Claude API (default) - uses claude CLI
  claude:
    type: claude  # optional, this is the default
    context_window: 150000  # Max context tokens (default: 150000)
    # Uses your ANTHROPIC_API_KEY from environment
    # No additional configuration needed
    #
    # Optional: Add additional context to Claude's built-in system prompt
    # system_prompt: ~/.balloons/prompts/additional-context.md

  # OpenAI API - GPT models
  # openai:
  #   type: openai
  #   base_url: https://api.openai.com/v1
  #   api_key: ${OPENAI_API_KEY}  # env var reference
  #   model: gpt-4o  # or gpt-4o-mini, gpt-4-turbo, o1, etc.
  #   context_window: 128000
  #   # Custom system prompt (required for non-Claude backends)
  #   system_prompt: ~/.balloons/prompts/coding-assistant.md

  # OpenRouter - access many models via OpenAI-compatible API
  # openrouter:
  #   type: openai
  #   base_url: https://openrouter.ai/api/v1
  #   api_key: ${OPENROUTER_API_KEY}  # env var reference
  #   model: anthropic/claude-sonnet-4  # or any model on OpenRouter
  #   context_window: 200000
  #   # Custom system prompt (required for non-Claude backends)
  #   system_prompt: ~/.balloons/prompts/coding-assistant.md

  # Local llamacpp server - OpenAI-compatible API
  # llamacpp:
  #   type: openai
  #   base_url: http://localhost:8080/v1
  #   api_key: not-needed  # llamacpp doesn't require auth
  #   model: local-model  # model name doesn't matter for llamacpp
  #   system_prompt: ~/.balloons/prompts/minimal.md

  # LiteLLM proxy (legacy approach - still works with claude type)
  # llama70b:
  #   type: claude  # uses claude CLI pointed at LiteLLM
  #   base_url: http://localhost:4000
  #   api_key: sk-litellm  # LiteLLM doesn't check this, but Claude CLI requires it

  # Ollama - OpenAI-compatible API
  # ollama:
  #   type: openai
  #   base_url: http://localhost:11434/v1
  #   api_key: ollama  # ollama requires some value
  #   model: llama3.2  # or any model you've pulled
  #   system_prompt: ~/.balloons/prompts/minimal.md

  # AI SDK - Rust ai-sdk-openai-compatible crate (high-performance)
   # Requires: maturin develop in balloons-rs/crates/ai-sdk-openai-compatible-py
   # ai_sdk:
   #   type: ai_sdk
   #   base_url: http://localhost:8000  # OpenAI-compatible server (llama.cpp, vLLM, etc.)
   #   model: Qwen3.5-122B-A10B-Q6_K-00001-of-00004.gguf  # Model loaded on server
   #   api_key: not-needed  # Optional, for servers requiring auth
   #   context_window: 200000
   #   system_prompt: ~/.balloons/prompts/coding-assistant.md

# WebSocket server for web UI and external integrations
# Enables the React web UI (web/ui/) to connect to the running TUI
# websocket:
#   enabled: true         # Set to true to start WebSocket server
#   host: 0.0.0.0         # Bind address (use 0.0.0.0 for LAN access)
#   port: 8700            # WebSocket port (auth server runs on port+1)
#   # TLS configuration (required for HTTPS web UI)
#   tls:
#     enabled: true
#     cert_path: ~/.balloons/certs/dev.crt
#     key_path: ~/.balloons/certs/dev.key
#   # JWT authentication
#   jwt:
#     enabled: true
#     secret: your-secret-key  # Generate with: openssl rand -base64 32
#     expiration_seconds: 86400

# Bootstrap admin user (created on first run if no users exist)
# auth:
#   admin:
#     username: admin
#     password: changeme  # Change this!

# Voice input configuration (speech-to-text)
# Uses RealtimeSTT server for transcription
# See: https://github.com/KoljaB/RealtimeSTT
# voice_input:
#   enabled: false         # Set to true to show voice input button in web UI
#   server_host: 192.168.0.120  # RealtimeSTT server hostname/IP
#   data_port: 8012        # WebSocket port for audio streaming
#   control_port: 8011     # WebSocket port for control messages (optional)
